name: Build Odin Kernel

on:
  workflow_dispatch:
    inputs:
      root_manager:
        required: false
        default: 'sukisu-4.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      DOCKER_BUILDKIT: 1
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_SLOPPINESS: "time_macros,include_file_ctime,include_file_mtime"
      CCACHE_BASEDIR: /src

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-odin-${{ inputs.root_manager }}-${{ github.run_number }}
          restore-keys: |
            ccache-odin-${{ inputs.root_manager }}-

      - name: Clone kernel source
        run: |
          chmod +x build.sh clone-kernel.sh
          ./clone-kernel.sh
          cd kernel_xiaomi_odin
          git checkout "${{ inputs.root_manager }}"
          git submodule update --init --recursive

      - name: Build kernel
        run: ./build.sh "${{ inputs.root_manager }}"

      - name: Detect build hash
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Odin-Kernel-${{ inputs.root_manager }}-${{ steps.meta.outputs.sha }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
