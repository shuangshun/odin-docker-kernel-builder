name: Build Odin Kernel

on:
  workflow_dispatch:
    inputs:
      root_manager:
        required: false
        default: 'sukisu-4.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make build scripts executable
        run: |
          chmod +x build.sh clone-kernel.sh

      - name: Clone kernel source
        run: |
          ./clone-kernel.sh
          cd kernel_xiaomi_odin
          git checkout "${{ inputs.root_manager }}"
          git submodule update --init --recursive

      - name: Build kernel
        run: ./build.sh "${{ inputs.root_manager }}"

      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Odin-Kernel-${{ inputs.root_manager }}-${{ github.run_number }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 7
